[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkg_pep517_hatchling"
version = "1.0.0"
description = "Mock PEP 517 package using hatchling backend"
dependencies = [
    "PyYAML",
]
authors = [
    { name = "Colcon Dev", email = "dev@colcon.org" }
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
hello-pep517-hatchling = "pkg_pep517_hatchling.main:main"
